site_name: 神经网络
site_url: https://monkey404.github.io/nn/

repo_url: https://github.com/OpenHUTB/nn
edit_uri: edit/main/docs/

theme:
  name: readthedocs
  sticky_navigation: true
  navigation_depth: 3

extra_css:
  - extra.css

extra_javascript:
  - extra.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML

plugins:
  - search:
      lang: zh
      separator: '[\s\-\.]+'
      min_search_length: 3

extra:
  generator: false

hooks:
  - hooks.py

copyright: OpenHUTB 版权所有 &copy; {year}

nav:
  - 首页: index.md
  - 城市交叉口信号配时智能优化: smart_intersection_signal_optimization.md
  - CarRacing DQN/DoubleDQN：训练改进与可视化对比: car_racing_dqn_improvements.md
  - 自动驾驶感知系统: carla_yolo_detection/README.md

markdown_extensions:
  - admonition
  - mdx_math
  - tables
